<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <pattern id="inv-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#171715" stroke-width="1" stroke-opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#f6f5ec"/>
  <rect width="1600" height="1000" fill="url(#inv-grid)"/>

  <!-- Header bar -->
  <rect x="40" y="40" width="1520" height="64" fill="#171715"/>
  <text x="68" y="79" fill="#d5ef64" font-family="SFMono-Regular, Consolas, monospace" font-size="18" letter-spacing="2">PLATE 02 // CIN7 OMNI × SHOPIFY — MULTI-BRANCH INVENTORY DIAGNOSTIC [PLACEHOLDER]</text>
  <rect x="1350" y="56" width="186" height="32" fill="#d5ef64"/>
  <text x="1370" y="77" fill="#171715" font-family="SFMono-Regular, Consolas, monospace" font-weight="700" font-size="15" letter-spacing="1.5">REPLACEABLE</text>

  <!-- Split Comparison Matrix -->
  <!-- Left Card: Display Scope (All Branches) -->
  <rect x="40" y="136" width="736" height="510" fill="#ffffff" stroke="#171715" stroke-width="2.5"/>
  <rect x="40" y="136" width="736" height="54" fill="#d5ef64" stroke="#171715" stroke-width="2.5"/>
  <text x="68" y="170" fill="#171715" font-family="SFMono-Regular, Consolas, monospace" font-weight="700" font-size="17">CHANNEL A // STOREFRONT DISPLAY SCOPE (ALL BRANCHES)</text>

  <g transform="translate(72, 224)">
    <text x="0" y="24" fill="#626259" font-family="SFMono-Regular, Consolas, monospace" font-size="15">AGGREGATED STOCK QUERY</text>
    <text x="0" y="76" fill="#171715" font-family="Helvetica Neue, PingFang SC, sans-serif" font-weight="700" font-size="44">前台展示：全仓合计有货</text>

    <!-- Branch bars -->
    <rect x="0" y="116" width="672" height="58" fill="#f4f1e9" stroke="#171715" stroke-width="1.5"/>
    <rect x="0" y="116" width="260" height="58" fill="#d5ef64" stroke="#171715" stroke-width="1.5"/>
    <text x="20" y="151" fill="#171715" font-family="SFMono-Regular, Consolas, monospace" font-weight="700" font-size="16">BRANCH_MEL: 08 UNITS</text>
    <text x="480" y="151" fill="#171715" font-family="SFMono-Regular, Consolas, monospace" font-size="15">STATUS: SYNCED</text>

    <rect x="0" y="190" width="672" height="58" fill="#f4f1e9" stroke="#171715" stroke-width="1.5"/>
    <rect x="0" y="190" width="180" height="58" fill="#d5ef64" stroke="#171715" stroke-width="1.5"/>
    <text x="20" y="225" fill="#171715" font-family="SFMono-Regular, Consolas, monospace" font-weight="700" font-size="16">BRANCH_SYD: 04 UNITS</text>
    <text x="480" y="225" fill="#171715" font-family="SFMono-Regular, Consolas, monospace" font-size="15">STATUS: SYNCED</text>

    <rect x="0" y="268" width="672" height="72" fill="#171715"/>
    <text x="24" y="312" fill="#d5ef64" font-family="SFMono-Regular, Consolas, monospace" font-weight="700" font-size="22">SHOPIFY TOTAL AVAILABLE = 12 UNITS (SELLABLE)</text>
  </g>

  <!-- Right Card: Fulfillment Allocation (Order Branch) -->
  <rect x="824" y="136" width="736" height="510" fill="#171715" stroke="#171715" stroke-width="2.5"/>
  <rect x="824" y="136" width="736" height="54" fill="#f49a63" stroke="#171715" stroke-width="2.5"/>
  <text x="852" y="170" fill="#171715" font-family="SFMono-Regular, Consolas, monospace" font-weight="700" font-size="17">CHANNEL B // ORDER ALLOCATION RULE (SINGLE BRANCH)</text>

  <g transform="translate(856, 224)">
    <text x="0" y="24" fill="#f49a63" font-family="SFMono-Regular, Consolas, monospace" font-size="15">FULFILLMENT LOCK &amp; API READBACK</text>
    <text x="0" y="76" fill="#f7f5ee" font-family="Helvetica Neue, PingFang SC, sans-serif" font-weight="700" font-size="44">订单履约：仅扣所属分支仓</text>

    <rect x="0" y="116" width="672" height="58" fill="#252522" stroke="#626259" stroke-width="1.5"/>
    <text x="20" y="151" fill="#f7f5ee" font-family="SFMono-Regular, Consolas, monospace" font-size="16">ASSIGNED: BRANCH_BNE → AVAILABLE: 00 UNITS</text>
    <text x="520" y="151" fill="#f49a63" font-family="SFMono-Regular, Consolas, monospace" font-weight="700" font-size="16">BLOCKED</text>

    <rect x="0" y="190" width="672" height="58" fill="#252522" stroke="#626259" stroke-width="1.5"/>
    <text x="20" y="225" fill="#f7f5ee" font-family="SFMono-Regular, Consolas, monospace" font-size="16">POST /Adjustments { holdingQty: 1 } → 200 OK</text>
    <text x="500" y="225" fill="#d5ef64" font-family="SFMono-Regular, Consolas, monospace" font-weight="700" font-size="16">READBACK: 0</text>

    <rect x="0" y="268" width="672" height="72" fill="#d5ef64"/>
    <text x="24" y="312" fill="#171715" font-family="SFMono-Regular, Consolas, monospace" font-weight="700" font-size="21">ROOT CAUSE: DISPLAY SCOPE ≠ ALLOCATION SCOPE</text>
  </g>

  <!-- Center Not-Equal Badge overlapping both -->
  <rect x="752" y="346" width="96" height="96" fill="#d5ef64" stroke="#171715" stroke-width="3"/>
  <text x="777" y="416" fill="#171715" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="68">≠</text>

  <!-- Bottom Placeholder Art Plate -->
  <rect x="40" y="680" width="1520" height="280" fill="#d5ef64" stroke="#171715" stroke-width="2.5"/>
  <rect x="72" y="712" width="190" height="34" fill="#171715"/>
  <text x="90" y="734" fill="#d5ef64" font-family="SFMono-Regular, Consolas, monospace" font-weight="700" font-size="14">LARGE ART SLOT 02</text>
  <text x="72" y="800" fill="#171715" font-family="Helvetica Neue, Arial, PingFang SC, sans-serif" font-weight="700" font-size="44" letter-spacing="-1">CIN7 × SHOPIFY — 跨系统库存与接口读回视觉占位画板</text>
  <text x="72" y="852" fill="#171715" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="22">用高对比包豪斯架构图替代主页零散截图；原脱敏工作台截图保留在案例详情页。</text>
  <text x="72" y="910" fill="#171715" font-family="SFMono-Regular, Consolas, monospace" font-weight="700" font-size="15">REPLACE WITH: assets/placeholder-inventory-hero.svg OR CUSTOM DIAGRAM</text>
</svg>
