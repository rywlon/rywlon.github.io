<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <pattern id="talk-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#171715" stroke-width="1" stroke-opacity="0.16"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#f7f4ec"/>
  <rect width="1600" height="1000" fill="url(#talk-grid)"/>

  <!-- Header -->
  <rect x="40" y="40" width="1520" height="64" fill="#171715"/>
  <text x="68" y="79" fill="#f49a63" font-family="SFMono-Regular, Consolas, monospace" font-size="18" letter-spacing="2">PLATE 03 // TALKWTF — DIRECTED VOICE-TO-AGENT ROUTER FOR macOS [PLACEHOLDER]</text>
  <rect x="1350" y="56" width="186" height="32" fill="#f49a63"/>
  <text x="1370" y="77" fill="#171715" font-family="SFMono-Regular, Consolas, monospace" font-weight="700" font-size="15" letter-spacing="1.5">REPLACEABLE</text>

  <!-- Left Acoustic Waveform & Hotkey Matrix -->
  <rect x="40" y="136" width="920" height="510" fill="#171715" stroke="#171715" stroke-width="2"/>
  <rect x="72" y="168" width="440" height="36" fill="#f49a63"/>
  <text x="90" y="192" fill="#171715" font-family="SFMono-Regular, Consolas, monospace" font-weight="700" font-size="15">HOTKEY LOCK: fn + option_right + right</text>

  <!-- Synthesizer Bars / Voice Spectrum -->
  <g transform="translate(72, 244)">
    <rect x="0" y="90" width="22" height="80" fill="#f49a63"/>
    <rect x="34" y="50" width="22" height="160" fill="#f49a63"/>
    <rect x="68" y="10" width="22" height="240" fill="#f49a63"/>
    <rect x="102" y="65" width="22" height="130" fill="#f49a63"/>
    <rect x="136" y="25" width="22" height="210" fill="#d5ef64"/>
    <rect x="170" y="0" width="22" height="260" fill="#d5ef64"/>
    <rect x="204" y="40" width="22" height="180" fill="#d5ef64"/>
    <rect x="238" y="80" width="22" height="100" fill="#f49a63"/>
    <rect x="272" y="30" width="22" height="200" fill="#f49a63"/>
    <rect x="306" y="15" width="22" height="230" fill="#b6a0e8"/>
    <rect x="340" y="55" width="22" height="150" fill="#b6a0e8"/>
    <rect x="374" y="95" width="22" height="70" fill="#f49a63"/>
    <rect x="408" y="45" width="22" height="170" fill="#f49a63"/>
    <rect x="442" y="20" width="22" height="220" fill="#d5ef64"/>
    <rect x="476" y="70" width="22" height="120" fill="#f49a63"/>
    <rect x="510" y="100" width="22" height="60" fill="#f49a63"/>

    <!-- Routing Vector Overlay -->
    <rect x="570" y="16" width="280" height="228" fill="#242421" stroke="#f49a63" stroke-width="2"/>
    <text x="594" y="54" fill="#f49a63" font-family="SFMono-Regular, Consolas, monospace" font-size="14">DESTINATION LOCKED</text>
    <text x="594" y="98" fill="#f7f5ee" font-family="Helvetica Neue, PingFang SC, sans-serif" font-weight="700" font-size="28">说话之前，</text>
    <text x="594" y="136" fill="#f7f5ee" font-family="Helvetica Neue, PingFang SC, sans-serif" font-weight="700" font-size="28">目的地已经确定。</text>
    <text x="594" y="186" fill="#d5ef64" font-family="SFMono-Regular, Consolas, monospace" font-size="14">SESSION: CODEX_CLI #01</text>
    <text x="594" y="214" fill="#c5c3ba" font-family="SFMono-Regular, Consolas, monospace" font-size="13">ACK: VERIFIED OR RETAIN TEXT</text>
  </g>

  <text x="72" y="592" fill="#c5c3ba" font-family="SFMono-Regular, Consolas, monospace" font-size="15">AUDIO CAPTURE → LOCAL TRANSCRIBE → BOUND SESSION DELIVERY (NO WINDOW SWITCHING)</text>

  <!-- Right Column: Multi-Agent Session Matrix -->
  <rect x="992" y="136" width="568" height="510" fill="#ffffff" stroke="#171715" stroke-width="2.5"/>
  <rect x="992" y="136" width="568" height="54" fill="#171715"/>
  <text x="1020" y="170" fill="#f7f5ee" font-family="SFMono-Regular, Consolas, monospace" font-weight="700" font-size="16">PAIRED AGENT SESSIONS // ROUTING TABLE</text>

  <g transform="translate(1024, 218)">
    <rect width="504" height="114" fill="#f49a63" stroke="#171715" stroke-width="2"/>
    <text x="24" y="36" fill="#171715" font-family="SFMono-Regular, Consolas, monospace" font-weight="700" font-size="14">ACTIVE TARGET · HOTKEY 01</text>
    <text x="24" y="72" fill="#171715" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="26">Codex CLI — Workspace A</text>
    <text x="24" y="98" fill="#171715" font-family="SFMono-Regular, Consolas, monospace" font-size="14">KEY: fn + option_right + right</text>
  </g>

  <g transform="translate(1024, 352)">
    <rect width="504" height="114" fill="#f4f1e9" stroke="#171715" stroke-width="1.5"/>
    <text x="24" y="36" fill="#626259" font-family="SFMono-Regular, Consolas, monospace" font-size="14">STANDBY · HOTKEY 02</text>
    <text x="24" y="72" fill="#171715" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="26">Claude Code — Backend</text>
    <text x="24" y="98" fill="#626259" font-family="SFMono-Regular, Consolas, monospace" font-size="14">KEY: fn + option_right + left</text>
  </g>

  <g transform="translate(1024, 486)">
    <rect width="504" height="114" fill="#f4f1e9" stroke="#171715" stroke-width="1.5"/>
    <text x="24" y="36" fill="#626259" font-family="SFMono-Regular, Consolas, monospace" font-size="14">STANDBY · HOTKEY 03</text>
    <text x="24" y="72" fill="#171715" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="26">Cursor Agent — UI Refactor</text>
    <text x="24" y="98" fill="#626259" font-family="SFMono-Regular, Consolas, monospace" font-size="14">KEY: fn + option_right + up</text>
  </g>

  <!-- Bottom Placeholder Banner -->
  <rect x="40" y="680" width="1520" height="280" fill="#f49a63" stroke="#171715" stroke-width="2.5"/>
  <rect x="72" y="712" width="190" height="34" fill="#171715"/>
  <text x="90" y="734" fill="#f49a63" font-family="SFMono-Regular, Consolas, monospace" font-weight="700" font-size="14">LARGE ART SLOT 03</text>
  <text x="72" y="800" fill="#171715" font-family="Helvetica Neue, Arial, PingFang SC, sans-serif" font-weight="700" font-size="44" letter-spacing="-1">TALKWTF — 定向语音热键与多会话投递视觉占位画板</text>
  <text x="72" y="852" fill="#171715" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="22">当前为高精占位大图（1600 × 1000），原 macOS 应用实机截图保留在案例详情页。</text>
  <text x="72" y="910" fill="#171715" font-family="SFMono-Regular, Consolas, monospace" font-weight="700" font-size="15">REPLACE WITH: assets/placeholder-talk-hero.svg OR PRODUCT KEY ART</text>
</svg>
